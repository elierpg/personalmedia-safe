{% extends "base.html" %}

{% block title %}Login - Mi Media Server{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-6 sm:py-8 min-h-0 login-safe">

    <div class="w-full max-w-md rounded-[2rem] overflow-hidden glass-panel self-center">

        <div class="p-7 sm:p-10 flex flex-col justify-center bg-card/20">

            <div class="flex items-center gap-3 justify-center mb-6">
                <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shadow-[0_0_15px_var(--primary)]">
                    <i class="fa-solid fa-play text-white text-sm"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">
                    Mi Biblioteca
                </span>
            </div>

            <div class="text-center mb-7">
                <h2 class="text-[1.35rem] sm:text-2xl font-bold tracking-tight text-text">Admin Authentication</h2>
                <p class="text-text-secondary text-[15px] mt-1.5">Access your management console</p>
            </div>

            {% if error %}
            <div class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-2.5 rounded-xl mb-6 animate-pulse">
                <i class="fa-solid fa-circle-exclamation text-xs"></i>
                <p class="text-xs font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-4">

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-widest text-text-secondary ml-1">Username</label>
                    <div class="relative group">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-primary transition-colors text-sm"></i>
                        <input type="text" name="username" required
                            class="w-full min-h-[48px] pl-11 pr-4 py-3.5 bg-background/50 rounded-2xl border border-hairline focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all text-text text-[16px]"
                            placeholder="Admin ID">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-widest text-text-secondary ml-1">Password</label>
                    <div class="relative group">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-primary transition-colors text-sm"></i>
                        
                        <input type="password" id="password" name="password" required
                            class="w-full min-h-[48px] pl-11 pr-12 py-3.5 bg-background/50 rounded-2xl border border-hairline focus:border-primary/50 focus:ring-4 focus:ring-primary/10 outline-none transition-all text-text text-[16px]"
                            placeholder="••••••••">

                        <button type="button" onclick="togglePassword()" aria-label="Mostrar contraseña"
                            class="absolute right-1.5 top-1/2 -translate-y-1/2 w-11 h-11 inline-flex items-center justify-center rounded-xl text-text-secondary hover:text-primary transition-colors">
                            <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full min-h-[50px] py-3.5 rounded-2xl bg-primary hover:brightness-110 text-background font-bold text-[17px] transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-3 mt-5">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>

            </form>

        </div>
    </div>
</div>

<style>
    /* Keep login focused but safe-area/keyboard friendly on iPhone */
    html, body {
        min-height: 100%;
        min-height: 100dvh;
    }
    body {
        overflow-x: hidden;
    }
    main {
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 7.5rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    input::placeholder {
        color: color-mix(in srgb, var(--text-sec) 45%, transparent);
    }
    @supports (padding: max(0px)) {
        .login-safe {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));
        }
    }
</style>

<script>
    function togglePassword() {
        const input = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }
</script>

{% endblock %}
